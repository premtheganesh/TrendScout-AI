name: weekly-update

on:
  schedule:
    - cron: "0 8 * * 1"      # Monday 08:00 UTC
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB: trendscout_ai
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      API_URL: ${{ secrets.API_URL }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      INDEX_DIR: /tmp/index
      SPACY_MODEL: en_core_web_trf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install
        run: |
          pip install -r requirements/pipeline.txt
          pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl
      - name: Ingest every scheduled source
        run: python scripts/ingest.py --schedule weekly --schedule daily
      - name: Process what changed
        run: python scripts/run_pipeline.py --stages refresh,entities,embed,snapshots,funding,companies,trends --funding-limit 150
      - name: Write last week's digest
        run: python scripts/generate_digest.py --week previous
      - name: Tell the API to rebuild its indexes
        if: env.API_URL != ''
        run: |
          curl -sf -m 120 -X POST -H "Authorization: Bearer $ADMIN_TOKEN" \
            "$API_URL/admin/reload" && echo "api reloaded"
