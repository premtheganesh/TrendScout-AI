[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
markers =
    needs_mongo: requires a reachable MongoDB (skipped otherwise)
    needs_indexes: requires built FAISS and BM25 indexes in INDEX_DIR (skipped otherwise)
    eval_corpus: runs against the frozen evaluation corpus (MONGODB_DB=trendscout_eval)
filterwarnings =
    ignore::DeprecationWarning:importlib._bootstrap
    ignore::DeprecationWarning:faiss.loader
